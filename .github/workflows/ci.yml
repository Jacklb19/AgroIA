name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"

jobs:
  lint:
    name: Python · ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: ruff check (falla el CI si hay avisos)
        run: |
          pip install ruff==0.16.8
          ruff check . --output-format=github

  python-tests:
    name: Python · pytest + Postgres 16 + cobertura
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agroia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Las pruebas `db` recrean el esquema public: solo corren contra este Postgres desechable.
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/agroia_test
      SUPABASE_DB_HOST: localhost
      SUPABASE_DB_USER: postgres
      SUPABASE_DB_PASSWORD: postgres
      SUPABASE_DB_NAME: agroia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt

      - name: Migraciones desde cero, dos veces (la segunda no debe cambiar nada)
        run: |
          python -m load.migrate
          python -m load.migrate | tee /tmp/segunda.txt
          grep -q "la base ya estaba al día" /tmp/segunda.txt

      - name: El diccionario de datos coincide con el esquema (docs/DICCIONARIO_DATOS.md)
        run: python scripts/gen_data_dictionary.py --check

      - name: Pruebas con cobertura mínima
        # El umbral es un piso que solo debe subir (hoy la cobertura de estos paquetes ronda el 50 %).
        run: >
          pytest -q --cov=clean --cov=load --cov=utils --cov=config --cov=models.informe_precios
          --cov-report=term-missing:skip-covered --cov-fail-under=40

  precios-minimo:
    name: Python · servicio de precios con dependencias mínimas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-precios.txt
      - run: pip install -r requirements-precios.txt pytest==9.1.1
      - name: El job horario no debe necesitar geopandas, optuna, shap ni statsmodels
        run: |
          python -c "import run_prices, models.informe_precios, models.train_precio_forecast, load.ingest_log, load.migrate"
          pytest -q tests/test_precios_diarios.py tests/test_informe_precios.py tests/test_precio_forecast.py

  web:
    name: Web · lint, build, auditoría y humo E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agroia_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: web
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: agroia_e2e
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSL: disable
      ANTHROPIC_API_KEY: dummy_for_build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Auditoría de dependencias (informativa)
        # Next 14 acumula avisos que solo corrige Next 15.5+/16 (cambio mayor). Se muestra pero no bloquea hasta migrar.
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-precios.txt
      - name: Sembrar la base con datos de ejemplo
        working-directory: .
        env:
          SUPABASE_DB_HOST: localhost
          SUPABASE_DB_USER: postgres
          SUPABASE_DB_PASSWORD: postgres
          SUPABASE_DB_NAME: agroia_e2e
        run: |
          pip install -r requirements-precios.txt
          python scripts/seed_dev.py

      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  docker:
    name: Docker · construir imágenes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Imagen del pipeline
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=pipeline
          cache-to: type=gha,scope=pipeline,mode=max
      - name: Imagen del job de precios
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.precios
          push: false
          load: true
          tags: agroia-precios:ci
          cache-from: type=gha,scope=precios
          cache-to: type=gha,scope=precios,mode=max
      - name: La imagen de precios arranca e importa el orquestador
        run: docker run --rm agroia-precios:ci python -c "import run_prices; print('ok')"
